<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760"><rect width="1270" height="760" fill="#f4f1eb"/><text x="70" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#eb6d3c">ONE SIMPLE FLOW</text><text x="70" y="158" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#171717">Natural input. One decision.</text><text x="70" y="212" font-family="Arial,sans-serif" font-size="25" fill="#696969">Axcas handles hosting, storage, generation and checks behind the scenes.</text><g font-family="Arial,sans-serif"><rect x="70" y="300" width="250" height="300" rx="26" fill="white" stroke="#d9d3c9"/><circle cx="118" cy="350" r="25" fill="#ffdfc4"/><text x="109" y="359" font-size="24" font-weight="700">1</text><text x="96" y="420" font-size="25" font-weight="700">Describe naturally</text><text x="96" y="466" font-size="19" fill="#696969">Voice, text, prices</text><text x="96" y="496" font-size="19" fill="#696969">and real media.</text><rect x="360" y="300" width="250" height="300" rx="26" fill="white" stroke="#d9d3c9"/><circle cx="408" cy="350" r="25" fill="#ffdfc4"/><text x="399" y="359" font-size="24" font-weight="700">2</text><text x="386" y="420" font-size="25" font-weight="700">Private preview</text><text x="386" y="466" font-size="19" fill="#696969">A complete mobile</text><text x="386" y="496" font-size="19" fill="#696969">site, not raw HTML.</text><rect x="650" y="300" width="250" height="300" rx="26" fill="#dff6df" stroke="#9ac9a4"/><circle cx="698" cy="350" r="25" fill="#176b49"/><text x="689" y="359" font-size="24" font-weight="700" fill="white">3</text><text x="676" y="420" font-size="25" font-weight="700">Independent check</text><text x="676" y="466" font-size="19" fill="#416452">Exact version, assets</text><text x="676" y="496" font-size="19" fill="#416452">and safe buttons.</text><rect x="940" y="300" width="250" height="300" rx="26" fill="#241b18"/><circle cx="988" cy="350" r="25" fill="#eb6d3c"/><text x="979" y="359" font-size="24" font-weight="700" fill="white">4</text><text x="966" y="420" font-size="25" font-weight="700" fill="white">One checklist</text><text x="966" y="466" font-size="19" fill="#ddd3ce">Approve this version.</text><text x="966" y="496" font-size="19" fill="#ddd3ce">Nothing else runs.</text></g><text x="70" y="682" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#171717">No customer API keys · No storage setup · No automatic publishing</text></svg>
